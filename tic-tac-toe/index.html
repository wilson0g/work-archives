<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Unbeatable Tic-Tac-Toe</h1>
<p class="subtitle">You're X. The AI uses minimax. Good luck.</p>

<div id="board"></div>

<p id="status">Your turn</p>
<div class="scores">
    <span>You: <b id="score-x">0</b></span>
    <span>Draws: <b id="score-d">0</b></span>
    <span>AI: <b id="score-o">0</b></span>
</div>
<button id="restart">Restart</button>
<p id="stats"></p>

<script src="script.js"></script>
</body>
</html>
